<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>栖岛 · 头像画风对比</title>
<!-- 开发用：给头像挑画风的对比页，游戏本身不加载这个文件。选定之后就删掉。 -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #efe7d6; color: #4a3a32; font: 15px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 620px; margin: 0 auto; padding: 18px 14px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lead { margin: 0 0 12px; opacity: .8; }
  .moods { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; position: sticky; top: 0; z-index: 2; background: #efe7d6; padding: 6px 0; }
  .moods button { font: inherit; padding: 4px 14px; border-radius: 99px; border: 1.5px solid #4a3a32; background: none; color: inherit; cursor: pointer; }
  .moods button.on { background: #4a3a32; color: #fff8ea; }
  section { background: #fffaf0; border-radius: 16px; padding: 14px 14px 12px; margin-bottom: 14px; box-shadow: 0 2px 0 rgba(74, 58, 50, .12); }
  h2 { font-size: 16px; margin: 0; }
  .note { margin: 2px 0 10px; font-size: 13px; opacity: .78; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; justify-items: center; }
  .big .av { width: min(84px, 100%); }
  .big span { display: block; text-align: center; font-size: 12px; margin-top: 3px; }
  .small { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .small em { font-style: normal; font-size: 12px; opacity: .7; width: 4.4em; flex: none; white-space: nowrap; }
  .av { aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: var(--c); flex: none; }
  .av svg, .av img { width: 100%; height: 100%; display: block; }
  .av.px { border-radius: 20%; }
  .av.snap { background: color-mix(in srgb, var(--c) 30%, #fff); }
  .s44 { width: 44px; }
  .s30 { width: 30px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- “立体”画法：每一块右下压一圈暗、左上提一圈亮，再在身后落一点影子 -->
    <filter id="clay" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="-1" dy="-1.5" result="a1"/>
      <feGaussianBlur in="a1" stdDeviation="1.2" result="a1b"/>
      <feComposite in="SourceAlpha" in2="a1b" operator="out" result="rim"/>
      <feFlood flood-color="#50281a" flood-opacity=".5"/>
      <feComposite in2="rim" operator="in" result="shade"/>
      <feOffset in="SourceAlpha" dx="1" dy="1.4" result="a2"/>
      <feGaussianBlur in="a2" stdDeviation="1" result="a2b"/>
      <feComposite in="SourceAlpha" in2="a2b" operator="out" result="rim2"/>
      <feFlood flood-color="#fff" flood-opacity=".6"/>
      <feComposite in2="rim2" operator="in" result="light"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation=".9" result="sb"/>
      <feOffset in="sb" dx=".5" dy="1.1" result="so"/>
      <feFlood flood-color="#3c241c" flood-opacity=".34"/>
      <feComposite in2="so" operator="in" result="drop"/>
      <feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="light"/></feMerge>
    </filter>
  </defs>
</svg>
<main>
  <h1>头像画风对比</h1>
  <p class="lead">同样五位居民，用五种画法各画一遍。每种下面两排小的，是游戏里实际显示的大小。</p>
  <div class="moods">表情：<button data-m="1">勉强</button><button data-m="2" class="on">满意</button><button data-m="3">惊喜</button></div>
  <div id="list"></div>
</main>
<script type="module">
import { avatar } from './src/avatars.js';
import { ARCHETYPES } from './src/wishes.js';
import { C } from './src/config.js';
import * as THREE from './src/vendor/three.module.min.js';
import { buildResident } from './src/models.js';

const WHO = [['tang', '阿棠'], ['mo', '老莫'], ['yubo', '鱼伯'], ['su', '阿酥'], ['zi', '小紫']];
const INK = '#4a3a32';
const look = (id) => ARCHETYPES[id].look;

const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
const mix = (hex, to, k) => `rgb(${rgb(hex).map((v, i) => Math.round(v + (to[i] - v) * k)).join(',')})`;
const dark = (hex, k) => mix(hex, [40, 28, 24], k);
const lite = (hex, k) => mix(hex, [255, 255, 255], k);

// 把现在的头像拆成一块一块，挑出实心的色块（勾线、半透明的影子和腮红不算）
function pieces(id, mood) {
  const box = document.createElement('div');
  box.innerHTML = avatar(id, look(id), mood);
  const svg = box.firstChild;
  const solid = [...svg.children].filter((el) => {
    const f = el.getAttribute('fill');
    if (!f || f === 'none' || f.startsWith('rgba') || el.hasAttribute('opacity')) return false;
    return !(el.tagName === 'circle' && +el.getAttribute('r') < 1.2);
  });
  return { svg, solid };
}

// A 扁平：现在用的
const flat = (id, mood) => avatar(id, look(id), mood);

// B 描边：每一块后面垫一个加粗的深色影子，露出来的那一圈就是勾线
function outlined(id, mood) {
  const { svg, solid } = pieces(id, mood);
  const shoulders = svg.querySelector('path[fill^="rgba(60"]');
  if (shoulders) {
    const edge = shoulders.cloneNode();
    edge.setAttribute('fill', 'none');
    edge.setAttribute('stroke', INK);
    edge.setAttribute('stroke-width', 1.3);
    shoulders.after(edge);
  }
  for (const el of solid) {
    // 嘴上的胡子本身带一圈肤色的边，勾线要细一些，不然像两片嘴唇
    const own = el.getAttribute('stroke');
    const thin = own && !own.startsWith('rgba');
    const back = el.cloneNode(true);
    back.setAttribute('stroke', INK);
    back.setAttribute('stroke-width', thin ? 1.5 : 2.6);
    if (thin) el.removeAttribute('stroke');
    back.setAttribute('stroke-linejoin', 'round');
    el.before(back);
    if (el.getAttribute('stroke') && el.getAttribute('stroke').startsWith('rgba')) el.removeAttribute('stroke');
  }
  return svg.outerHTML;
}

// C 立体：每一块套上明暗
function clay(id, mood) {
  const { svg, solid } = pieces(id, mood);
  for (const el of solid) {
    el.setAttribute('filter', 'url(#clay)');
    if (el.getAttribute('stroke') && el.getAttribute('stroke').startsWith('rgba')) el.removeAttribute('stroke');
  }
  return svg.outerHTML;
}

// D 像素：16×16，一格一格点。底下是头和肩膀，上面叠各人的头发、帽子、胡子
const BASE = [
  '................',
  '................',
  '................',
  '................',
  '.....SSSSSS.....',
  '....SSSSSSSS....',
  '...SSSSSSSSSS...',
  '...SSSSSSSSSS...',
  '..sSSSSSSSSSSs..',
  '..sSSSSSSSSSSs..',
  '...SSSSSSSSSS...',
  '...SSSSSSSSSS...',
  '....SSSSSSSS....',
  '.....SSSSSS.....',
  '...DDDDDDDDDD...',
  '..DDDDDDDDDDDD..',
];
// 眼睛和嘴：[行, 列, 颜色]
const FACE = {
  1: [[8, 5, 'E'], [9, 5, 'E'], [8, 10, 'E'], [9, 10, 'E'], [12, 7, 'M'], [12, 8, 'M']],
  2: [[8, 5, 'E'], [9, 5, 'E'], [8, 10, 'E'], [9, 10, 'E'], [11, 6, 'M'], [11, 9, 'M'], [12, 7, 'M'], [12, 8, 'M']],
  3: [[8, 5, 'E'], [9, 4, 'E'], [9, 6, 'E'], [8, 10, 'E'], [9, 9, 'E'], [9, 11, 'E'], [11, 6, 'M'], [11, 7, 'M'], [11, 8, 'M'], [11, 9, 'M'], [12, 7, 'T'], [12, 8, 'T'], [10, 4, 'k'], [10, 11, 'k']],
};
const PIXEL = {
  tang: [
    '................',
    '......HHHH......',
    '.....HLHHHH.....',
    '......YYYY......',
    '.....HHHHHH.....',
    '....HLLHHHHH....',
    '...HHHHHHHHHH...',
    '...HH....HHHH...',
  ],
  mo: [
    '................',
    '.....WWWWWW.....',
    '....WLLWWWWW....',
    '....WWWWWWWW....',
    '....BBBBBBBB....',
    'WWWWWWWWWWWWWWWW',
    '.wwwwwwwwwwwwww.',
    '...H........H...',
    '................',
    '................',
    '.....HHHHHH.....',
    '....H......H....',
  ],
  yubo: [
    '................',
    '.......WW.......',
    '......WLWW......',
    '....WWLWWWWW....',
    '...WWLWWWWWWW...',
    '.WWWWWWWWWWWWWW.',
    'wwwwwwwwwwwwwwww',
    '...H.HH..HH.H...',
    '................',
    '................',
    '...H........H...',
    '...HHH....HHH...',
    '....HHH..HHH....',
    '.....HHHHHH.....',
    '......HHHH......',
    '.......HH.......',
  ],
  su: [
    '.....WWWWWW.....',
    '...WWWWWWWWWW...',
    '...WLLWWWWWWW...',
    '....WWWWWWWW....',
    '....WWWWWWWW....',
    '....wwwwwwww....',
    '...HHHHHHHHHH...',
    '...H........H...',
    '................',
    '................',
    '...kk......kk...',
  ],
  zi: [
    '................',
    '................',
    '................',
    '.....HHHHHH.....',
    '....HLLHHHHH....',
    '.b.HHHHHHHHHH.b.',
    '.bbHHHHHHHHHHbb.',
    '.HHHHHHHHHHHHHH.',
    'HHH..........HHH',
    'HHH..........HHH',
    'HHH..........HHH',
    '.HH..........HH.',
    '.H............H.',
  ],
};
function pixel(id, mood) {
  const l = look(id);
  const hat = l.hat === 'toque' ? l.tint : C.straw;
  const pal = {
    S: C.skin, s: dark(C.skin, 0.12), E: INK, M: '#7a3b30', T: '#ee8a78', k: '#f0a08a',
    H: l.hair, D: dark(l.body, 0.2), W: hat, w: dark(hat, 0.18), B: l.tint || dark(C.straw, 0.3),
    L: l.hat ? lite(hat, 0.5) : lite(l.hair, 0.25), Y: '#f6c453', b: '#d6b4f5',
  };
  const grid = BASE.map((r) => [...r]);
  for (const [r, c, k] of FACE[mood]) grid[r][c] = k;
  PIXEL[id].forEach((row, r) => {
    if (row.length !== 16) console.error('像素图第', r, '行不是 16 格', id);
    [...row].forEach((k, c) => { if (k !== '.') grid[r][c] = k; });
  });
  let out = '';
  grid.forEach((row, y) => {
    for (let x = 0; x < 16; ) {
      const k = row[x];
      let n = 1;
      while (x + n < 16 && row[x + n] === k) n++;
      if (k !== '.') out += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${pal[k]}"/>`;
      x += n;
    }
  });
  return `<svg viewBox="0 0 16 16" shape-rendering="crispEdges">${out}</svg>`;
}

// E 小人快照：把岛上的小人摆到镜头前拍一张
function snapshots() {
  const size = 220;
  const canvas = document.createElement('canvas');
  const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1);
  r.setSize(size, size, false);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#ffffff', '#d8c8b0', 1.9));
  const sun = new THREE.DirectionalLight('#fff4e0', 2.4);
  sun.position.set(-2, 6, 5);
  scene.add(sun);
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50);
  const out = {};
  for (const [id] of WHO) {
    const fig = buildResident(look(id));
    scene.add(fig);
    // 只拍肩膀以上，每个人的头一样大
    const cy = 0.33;
    const half = 0.18;
    Object.assign(cam, { left: -half, right: half, top: half, bottom: -half });
    cam.updateProjectionMatrix();
    cam.position.set(1.2, cy + 0.8, 6);
    cam.lookAt(0, cy, 0);
    r.render(scene, cam);
    out[id] = `<img alt="" src="${canvas.toDataURL('image/png')}">`;
    scene.remove(fig);
  }
  r.dispose();
  return out;
}
let snaps = {};
try {
  snaps = snapshots();
} catch (e) {
  console.error(e);
}

const STYLES = [
  { key: 'a', name: 'A　扁平（现在用的）', note: '纯色块拼出来，没有勾线，也没有明暗。', draw: flat },
  { key: 'b', name: 'B　描边', note: '造型和 A 一样，每一块外面勾一圈深色的线，像贴纸。', draw: outlined },
  { key: 'c', name: 'C　立体', note: '造型和 A 一样，每一块加上高光和阴影，像黏土捏的。', draw: clay },
  { key: 'px', name: 'D　像素', note: '16×16 的小格子，一格一格点出来。', draw: pixel },
  { key: 'snap', name: 'E　小人快照', note: '直接给岛上的小人拍一张，头像和岛上的人完全一致。小人没有表情，评价得另外用标记表示。', draw: (id) => snaps[id] || '' },
];

const list = document.getElementById('list');
function render(mood) {
  list.innerHTML = STYLES.map((st) => {
    const one = (id, cls) => `<div class="av ${st.key} ${cls}" style="--c:${look(id).body}">${st.draw(id, mood)}</div>`;
    return (
      `<section><h2>${st.name}</h2><p class="note">${st.note}</p>` +
      `<div class="row big">${WHO.map(([id, name]) => `<div>${one(id, '')}<span>${name}</span></div>`).join('')}</div>` +
      `<div class="small"><em>电脑大小</em>${WHO.map(([id]) => one(id, 's44')).join('')}</div>` +
      `<div class="small"><em>手机大小</em>${WHO.map(([id]) => one(id, 's30')).join('')}</div></section>`
    );
  }).join('');
}
render(2);
for (const b of document.querySelectorAll('.moods button')) {
  b.onclick = () => {
    for (const o of document.querySelectorAll('.moods button')) o.classList.toggle('on', o === b);
    render(+b.dataset.m);
  };
}
</script>
</body>
</html>
